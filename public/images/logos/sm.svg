<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- SM 팬아트 로고: 핑크+화이트 모던 스타일 -->
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1493"/>
      <stop offset="100%" stop-color="#c71585"/>
    </linearGradient>
    <filter id="sm-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#sm-bg)"/>
  <!-- 배경 원형 장식 -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>
  <!-- SM 텍스트 -->
  <text x="60" y="70" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="700" fill="white" filter="url(#sm-glow)" letter-spacing="2">SM</text>
  <!-- 작은 별 장식 -->
  <circle cx="30" cy="30" r="2" fill="white" opacity="0.5"/>
  <circle cx="92" cy="35" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="85" cy="88" r="2" fill="white" opacity="0.3"/>
</svg>
