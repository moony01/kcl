<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- HYBE 팬아트 로고: 블랙+골드 미니멀 스타일 -->
  <defs>
    <linearGradient id="hybe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="hybe-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e68c"/>
      <stop offset="100%" stop-color="#daa520"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#hybe-bg)"/>
  <!-- 장식선 -->
  <line x1="20" y1="30" x2="100" y2="30" stroke="#daa520" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="90" x2="100" y2="90" stroke="#daa520" stroke-width="1" opacity="0.3"/>
  <!-- HYBE 텍스트 -->
  <text x="60" y="67" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="32" font-weight="900" fill="url(#hybe-text)" letter-spacing="3">HYBE</text>
  <!-- 작은 장식 다이아몬드 -->
  <polygon points="60,22 63,26 60,30 57,26" fill="#daa520" opacity="0.6"/>
  <polygon points="60,90 63,94 60,98 57,94" fill="#daa520" opacity="0.6"/>
</svg>
