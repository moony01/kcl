<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- YG 팬아트 로고: 블랙+골드 스트릿 스타일 -->
  <defs>
    <linearGradient id="yg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="yg-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffec8b"/>
      <stop offset="100%" stop-color="#daa520"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#yg-bg)"/>
  <!-- 코너 장식 -->
  <path d="M20,20 L35,20 L20,35 Z" fill="#ffd700" opacity="0.15"/>
  <path d="M100,100 L85,100 L100,85 Z" fill="#ffd700" opacity="0.15"/>
  <!-- YG 텍스트 -->
  <text x="60" y="70" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900" fill="url(#yg-gold)" letter-spacing="2">YG</text>
  <!-- 밑줄 장식 -->
  <rect x="25" y="78" width="70" height="2" rx="1" fill="#ffd700" opacity="0.3"/>
</svg>
