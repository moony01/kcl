name: KCL Data Patch - Starship Company Logo

on:
  push:
    branches:
      - ops/replace-hmusic-the-muze-20260603
    paths:
      - '.github/workflows/kcl-data-patch-starship-company-logo.yml'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  STARSHIP_LOGO_URL: https://www.starship-ent.com/images/assets/starship_ci.jpg

jobs:
  patch-starship-company-logo:
    name: Patch Starship company CI logo URL
    runs-on: ubuntu-latest
    steps:
      - name: Verify official logo asset
        run: |
          set -euo pipefail
          echo "Checking official Starship CI asset..."
          curl -fsSL --max-time 20 "$STARSHIP_LOGO_URL" -o /tmp/starship_ci.jpg
          python3 - <<'PY'
          from pathlib import Path
          import imghdr
          p = Path('/tmp/starship_ci.jpg')
          data = p.read_bytes()
          kind = imghdr.what(p)
          print(f'asset_kind={kind} bytes={len(data)}')
          if kind not in {'jpeg', 'png'}:
              raise SystemExit('unexpected image type')
          if len(data) < 1000:
              raise SystemExit('asset too small')
          PY

      - name: Patch live Starship row
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "SUPABASE_URL secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY secret is missing"
            exit 1
          fi

          API="$SUPABASE_URL/rest/v1/kcl_companies?slug=eq.starship-entertainment&deleted_at=is.null"
          HEADERS=(
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            -H "Content-Type: application/json"
          )

          before=$(curl -fsSL "$API&select=id,name_en,slug,logo_url" "${HEADERS[@]}")
          echo "Before: $before"
          python3 - <<'PY' "$before"
          import json, sys
          rows = json.loads(sys.argv[1])
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one Starship row, got {len(rows)}')
          print('preflight_ok')
          PY

          body=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'logo_url': os.environ['STARSHIP_LOGO_URL']}))
          PY
          )

          status=$(curl -sS -o /tmp/patch-response.txt -w '%{http_code}' -X PATCH "$API" \
            "${HEADERS[@]}" \
            -d "$body")
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "PATCH failed status=$status"
            cat /tmp/patch-response.txt
            exit 1
          fi

          after=$(curl -fsSL "$API&select=name_en,slug,logo_url" "${HEADERS[@]}")
          echo "After: $after"
          python3 - <<'PY' "$after"
          import json, os, sys
          rows = json.loads(sys.argv[1])
          expected = os.environ['STARSHIP_LOGO_URL']
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one Starship row after patch, got {len(rows)}')
          got = rows[0].get('logo_url')
          if got != expected:
              raise SystemExit(f'logo_url mismatch: {got!r} != {expected!r}')
          print('READBACK_OK')
          PY
