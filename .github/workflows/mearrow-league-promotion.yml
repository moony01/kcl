# MEARROW 월초 시즌 정산 자동화
#
# 매월 1일 00:00 UTC (한국시간 09:00)에 실행
#
# 실행 순서:
# 0. 시즌 순위 스냅샷 - 승강 전 전체 순위 저장 (snapshot_season_rankings)
# 1. 챔피언 기록 - 전월 1위를 seasons에 기록 (Hall of Fame)
# 2. 리그 승강 + firepower 초기화 - monthly_league_promotion이 승강/초기화 모두 처리
#
# 참고: monthly_league_promotion 함수가 내부에서 firepower 초기화까지 수행하므로
#       별도 reset_monthly_firepower 호출은 불필요 (이중 초기화 방지)
#
# 수동 실행: Actions 탭 > "MEARROW Monthly Season Settlement" > Run workflow

name: MEARROW Monthly Season Settlement

concurrency:
  group: mearrow-monthly-season-settlement
  cancel-in-progress: false

on:
  schedule:
    # 매월 1일 00:00 UTC (한국시간 09:00)
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # 수동 실행 지원 (테스트용)
    inputs:
      dry_run:
        description: 'Dry run (실제 실행하지 않고 테스트만)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  EXPECTED_SUPABASE_HOST: bxnwdiurtrepozgyhzlt.supabase.co

jobs:
  monthly-settlement:
    name: Execute Monthly Season Settlement
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate production Supabase target
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "❌ SUPABASE_URL is not configured"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY is not configured"
            exit 1
          fi

          SUPABASE_HOST="${SUPABASE_URL#https://}"
          SUPABASE_HOST="${SUPABASE_HOST#http://}"
          SUPABASE_HOST="${SUPABASE_HOST%%/*}"

          if [ "$SUPABASE_HOST" != "$EXPECTED_SUPABASE_HOST" ]; then
            echo "❌ Unexpected Supabase target: $SUPABASE_HOST"
            echo "   Expected production project: $EXPECTED_SUPABASE_HOST"
            exit 1
          fi

          echo "✅ Production Supabase target verified: $SUPABASE_HOST"

      - name: Log execution info
        run: |
          echo "🏆 MEARROW Monthly Season Settlement"
          echo "📅 Execution time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📅 Korea time: $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')"
          echo "🔧 Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo ""
          echo "📋 실행 순서:"
          echo "   0. 시즌 순위 스냅샷 (snapshot_season_rankings)"
          echo "   1. 챔피언 기록 (record_monthly_champion)"
          echo "   2. 리그 승강 + firepower 초기화 (monthly_league_promotion)"

      # Step 0: 시즌 순위 스냅샷 (승강 전 전체 순위 저장)
      # 언제든 restore_season_state(year, month)로 원복 가능하도록 스냅샷 먼저 저장
      - name: Step 0 - Snapshot season rankings
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "📸 [Step 0/2] Snapshotting season rankings before promotion..."

          RESPONSE=$(curl -s -w '\n__HTTP_STATUS__%{http_code}' -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/snapshot_season_rankings" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json")
          HTTP_STATUS=$(printf '%s\n' "$RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          BODY=$(printf '%s\n' "$RESPONSE" | grep -v '__HTTP_STATUS__')

          echo "📊 HTTP Status: $HTTP_STATUS"
          echo "📊 Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP error: $HTTP_STATUS"
            exit 1
          fi

          if echo "$BODY" | grep -qE '"success"\s*:\s*true'; then
            echo "✅ Season rankings snapshot saved!"
          else
            echo "⚠️ Snapshot may already exist for this month (skipped)"
          fi

      # Step 1: 월간 챔피언 기록 (현재 firepower 기준 1위)
      # 승강 전에 실행해야 현재 시즌 1위가 정확히 기록됨
      - name: Step 1 - Record monthly champion
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "🏅 [Step 1/2] Recording monthly champion to Hall of Fame..."

          RESPONSE=$(curl -s -w '\n__HTTP_STATUS__%{http_code}' -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/record_monthly_champion" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json")
          HTTP_STATUS=$(printf '%s\n' "$RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          BODY=$(printf '%s\n' "$RESPONSE" | grep -v '__HTTP_STATUS__')

          echo "📊 HTTP Status: $HTTP_STATUS"
          echo "📊 Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP error: $HTTP_STATUS"
            exit 1
          fi

          if echo "$BODY" | grep -qE '"success"\s*:\s*true'; then
            echo "✅ Monthly champion recorded successfully!"
          else
            echo "⚠️ Could not record champion (may already exist or no data)"
          fi

      # Step 2: 리그 승강 + firepower 초기화 (함수 내부에서 모두 처리)
      # - previous_season_rank 저장
      # - 직행 승강: 1부 10위 ↔ 2부 1위
      # - 플레이오프: 2부 2위 > 1부 9위면 교체
      # - firepower 0 초기화 + groups vote_count 0 초기화
      - name: Step 2 - Execute league promotion & reset
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "🔄 [Step 2/2] Executing league promotion & firepower reset..."

          RESPONSE=$(curl -s -w '\n__HTTP_STATUS__%{http_code}' -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/monthly_league_promotion" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json")
          HTTP_STATUS=$(printf '%s\n' "$RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          BODY=$(printf '%s\n' "$RESPONSE" | grep -v '__HTTP_STATUS__')

          echo "📊 HTTP Status: $HTTP_STATUS"
          echo "📊 Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ HTTP error: $HTTP_STATUS"
            echo "Response body: $BODY"
            exit 1
          fi

          if echo "$BODY" | grep -qE '"success"\s*:\s*true'; then
            echo "✅ League promotion & firepower reset completed!"
            echo ""
            echo "📊 Details:"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          else
            echo "❌ League promotion failed!"
            echo "Response was: $BODY"
            exit 1
          fi

      # Step 3: 운영 DB 반영 검증
      # 정산 RPC가 성공해도 다른 Supabase 프로젝트를 가리키면 운영 화면은 바뀌지 않으므로
      # 운영 companies/seasons/season_rankings를 직접 확인해 실패를 명확히 드러낸다.
      - name: Step 3 - Verify production settlement
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          echo "🔎 [Verification] Checking production season settlement..."

          PREVIOUS_YEAR=$(date -u -d '1 month ago' '+%Y')
          PREVIOUS_MONTH=$(date -u -d '1 month ago' '+%-m')

          COMPANIES_RESPONSE=$(curl -sS -w '\n__HTTP_STATUS__%{http_code}' --get \
            "${SUPABASE_URL%/}/rest/v1/companies" \
            --data-urlencode 'select=firepower' \
            --data-urlencode 'order=firepower.desc' \
            --data-urlencode 'limit=1' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          COMPANIES_STATUS=$(printf '%s\n' "$COMPANIES_RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          COMPANIES_BODY=$(printf '%s\n' "$COMPANIES_RESPONSE" | grep -v '__HTTP_STATUS__')

          if [ "$COMPANIES_STATUS" != "200" ]; then
            echo "❌ Production companies check failed: HTTP $COMPANIES_STATUS"
            echo "$COMPANIES_BODY"
            exit 1
          fi

          MAX_FIREPOWER=$(printf '%s' "$COMPANIES_BODY" | jq -er 'if type == "array" and length > 0 then .[0].firepower else error("companies response is empty") end')
          if [ "$MAX_FIREPOWER" != "0" ]; then
            echo "❌ Production firepower was not reset: max=$MAX_FIREPOWER"
            exit 1
          fi
          echo "✅ Production firepower reset verified: max=$MAX_FIREPOWER"

          SNAPSHOT_RESPONSE=$(curl -sS -w '\n__HTTP_STATUS__%{http_code}' --get \
            "${SUPABASE_URL%/}/rest/v1/season_rankings" \
            --data-urlencode 'select=company_id' \
            --data-urlencode "year=eq.$PREVIOUS_YEAR" \
            --data-urlencode "month=eq.$PREVIOUS_MONTH" \
            --data-urlencode 'limit=1' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          SNAPSHOT_STATUS=$(printf '%s\n' "$SNAPSHOT_RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          SNAPSHOT_BODY=$(printf '%s\n' "$SNAPSHOT_RESPONSE" | grep -v '__HTTP_STATUS__')

          if [ "$SNAPSHOT_STATUS" != "200" ]; then
            echo "❌ Production season snapshot check failed: HTTP $SNAPSHOT_STATUS"
            echo "$SNAPSHOT_BODY"
            exit 1
          fi

          SNAPSHOT_COUNT=$(printf '%s' "$SNAPSHOT_BODY" | jq -er 'if type == "array" then length else error("season_rankings response is not an array") end')
          if [ "$SNAPSHOT_COUNT" -lt 1 ]; then
            echo "❌ No production season snapshot found for ${PREVIOUS_YEAR}-${PREVIOUS_MONTH}"
            exit 1
          fi
          echo "✅ Production season snapshot verified: ${PREVIOUS_YEAR}-${PREVIOUS_MONTH} (rows checked=$SNAPSHOT_COUNT)"

          SEASON_RESPONSE=$(curl -sS -w '\n__HTTP_STATUS__%{http_code}' --get \
            "${SUPABASE_URL%/}/rest/v1/seasons" \
            --data-urlencode 'select=id' \
            --data-urlencode "year=eq.$PREVIOUS_YEAR" \
            --data-urlencode "month=eq.$PREVIOUS_MONTH" \
            --data-urlencode 'limit=1' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          SEASON_STATUS=$(printf '%s\n' "$SEASON_RESPONSE" | grep '__HTTP_STATUS__' | sed 's/__HTTP_STATUS__//')
          SEASON_BODY=$(printf '%s\n' "$SEASON_RESPONSE" | grep -v '__HTTP_STATUS__')

          if [ "$SEASON_STATUS" != "200" ]; then
            echo "❌ Production season record check failed: HTTP $SEASON_STATUS"
            echo "$SEASON_BODY"
            exit 1
          fi

          SEASON_COUNT=$(printf '%s' "$SEASON_BODY" | jq -er 'if type == "array" then length else error("seasons response is not an array") end')
          if [ "$SEASON_COUNT" -lt 1 ]; then
            echo "❌ No production Hall of Fame record found for ${PREVIOUS_YEAR}-${PREVIOUS_MONTH}"
            exit 1
          fi
          echo "✅ Production Hall of Fame record verified: ${PREVIOUS_YEAR}-${PREVIOUS_MONTH}"

      # Dry run 모드
      - name: Dry run mode
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "🧪 DRY RUN MODE - No changes made"
          echo ""
          echo "Would execute:"
          echo "  0. POST ${SUPABASE_URL%/}/rest/v1/rpc/snapshot_season_rankings"
          echo "  1. POST ${SUPABASE_URL%/}/rest/v1/rpc/record_monthly_champion"
          echo "  2. POST ${SUPABASE_URL%/}/rest/v1/rpc/monthly_league_promotion"
          echo ""
          echo "ℹ️ monthly_league_promotion handles promotion + firepower reset internally"

      # 완료 요약
      - name: Settlement summary
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          PREV_MONTH=$(TZ='Asia/Seoul' date -d '1 month ago' '+%Y년 %m월' 2>/dev/null || date -u -v-1m '+%Y년 %m월')
          echo ""
          echo "🎉 =================================="
          echo "   Monthly Settlement Completed!"
          echo "==================================="
          echo "📅 ${PREV_MONTH} 시즌 정산 완료"
          echo ""
          echo "✅ 챔피언 기록 완료 (seasons)"
          echo "✅ 리그 승강 완료 (league_tier 업데이트)"
          echo "✅ firepower 초기화 완료 (새 시즌 시작)"
          echo "✅ 운영 DB 반영 검증 완료 (companies/season_rankings/seasons)"
