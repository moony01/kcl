name: Deploy KCL Workers Preview

on:
  push:
    branches:
      - codex/kcl-ssr
  workflow_dispatch:

concurrency:
  group: kcl-workers-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build and deploy Preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Keep preview canonicals pointed at the public domain so it is not indexed.
      NEXT_PUBLIC_SITE_URL: https://www.kclhq.com

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"

      - name: Build OpenNext Worker
        run: pnpm exec opennextjs-cloudflare build --env preview

      - name: Verify Worker artifact
        run: test -f .open-next/worker.js

      - name: Deploy Preview Worker
        run: pnpm exec opennextjs-cloudflare deploy --env preview
