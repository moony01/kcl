name: KCL Data Patch - Replace H Music with THE MUZE

on:
  push:
    branches:
      - ops/replace-hmusic-the-muze-20260603
  workflow_dispatch:

jobs:
  replace-hmusic-the-muze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMPANY_ID: 9e920899-4937-4c61-9aa6-5539e4953d2b
      GROUP_ID: 62e5a962-66a1-4f9b-9271-676039888d7f
    steps:
      - name: Patch company and artist rows
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing Supabase secrets" >&2
            exit 1
          fi

          api() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            if [ -n "$body" ]; then
              curl -fsS -X "$method" \
                "${SUPABASE_URL}/rest/v1/${path}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -H "Prefer: return=representation" \
                --data "$body"
            else
              curl -fsS -X "$method" \
                "${SUPABASE_URL}/rest/v1/${path}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Accept: application/json"
            fi
          }

          before_company=$(api GET "kcl_companies?id=eq.${COMPANY_ID}&select=id,name_ko,name_en,slug,rank,firepower,league_tier,previous_season_rank,deleted_at")
          before_group=$(api GET "kcl_groups?id=eq.${GROUP_ID}&select=id,company_id,name_ko,name_en,slug,vote_count,is_active,debut_date,member_count,group_type")

          echo "Before company: ${before_company}"
          echo "Before group: ${before_group}"

          python3 - <<'PY' "$before_company" "$before_group"
          import json, sys
          company = json.loads(sys.argv[1])
          group = json.loads(sys.argv[2])
          if len(company) != 1 or company[0].get('name_en') != 'H Music':
              raise SystemExit(f"Unexpected company row before patch: {company}")
          if len(group) != 1 or group[0].get('name_en') != 'woo!ah!':
              raise SystemExit(f"Unexpected group row before patch: {group}")
          PY

          api PATCH "kcl_companies?id=eq.${COMPANY_ID}" '{"name_ko":"더뮤즈","name_en":"THE MUZE","slug":"the-muze","logo_url":null,"gradient_color":"#A855F7"}' >/tmp/patched_company.json
          api PATCH "kcl_groups?id=eq.${GROUP_ID}" '{"name_ko":"리센느","name_en":"RESCENE","slug":"rescene","debut_date":"2024-03-26","member_count":5,"group_type":"girl","is_active":true}' >/tmp/patched_group.json

          after_company=$(api GET "kcl_companies?id=eq.${COMPANY_ID}&select=id,name_ko,name_en,slug,rank,firepower,league_tier,previous_season_rank,deleted_at")
          after_group=$(api GET "kcl_groups?id=eq.${GROUP_ID}&select=id,company_id,name_ko,name_en,slug,vote_count,is_active,debut_date,member_count,group_type")
          top_list=$(api GET "kcl_companies?select=name_en,name_ko,slug,firepower,league_tier,previous_season_rank,groups:kcl_groups(name_en,name_ko,slug,is_active,debut_date)&deleted_at=is.null&order=firepower.desc,previous_season_rank.asc&limit=12")

          echo "After company: ${after_company}"
          echo "After group: ${after_group}"
          echo "Top list after patch: ${top_list}"

          python3 - <<'PY' "$after_company" "$after_group" "$top_list"
          import json, sys
          company = json.loads(sys.argv[1])
          group = json.loads(sys.argv[2])
          top = json.loads(sys.argv[3])
          assert len(company) == 1, company
          c = company[0]
          assert c['name_en'] == 'THE MUZE' and c['name_ko'] == '더뮤즈' and c['slug'] == 'the-muze', c
          assert c['league_tier'] == 'premier' and c['previous_season_rank'] == 6, c
          assert len(group) == 1, group
          g = group[0]
          assert g['name_en'] == 'RESCENE' and g['name_ko'] == '리센느' and g['slug'] == 'rescene', g
          assert g['debut_date'] == '2024-03-26' and g['member_count'] == 5 and g['is_active'] is True, g
          names = [item['name_en'] for item in top]
          assert 'THE MUZE' in names, names
          assert 'H Music' not in names, names
          print('VERIFIED: THE MUZE / RESCENE replaced H Music / woo!ah! in live KCL DB')
          PY
